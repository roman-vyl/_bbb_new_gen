[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data_engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pydantic-settings",
  "pybit",
  "tenacity",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest"]
research = ["numpy>=1.24", "pandas>=2.1", "PyYAML", "vectorbt>=0.26"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["data_engine*", "research*"]

[tool.pytest.ini_options]
markers = [
    "optional_vectorbt: requires the project research extra (vectorbt)",
]
